<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>교안 AI 요약 및 퀴즈 생성기</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-amber-50 min-h-screen text-slate-800">

    <!-- Header -->
    <header class="bg-yellow-400 shadow-md py-6 px-4 mb-8">
        <div class="max-w-4xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold text-amber-900 flex items-center gap-2">
                    📚 교안 스마트 요약 & 퀴즈 메이커
                </h1>
                <p class="text-amber-800 text-sm mt-1">PDF 교안을 올리면 핵심 요약과 4지선다 10문제를 뚝딱 만들어드려요!</p>
            </div>
            <!-- API Key Setting Toggle Button -->
            <button onclick="toggleSettings()" class="bg-white/80 hover:bg-white text-amber-900 text-sm font-semibold px-4 py-2 rounded-lg shadow-sm transition">
                ⚙️ API 키 설정
            </button>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 pb-16">
        
        <!-- API Key Modal / Box -->
        <div id="settingsBox" class="bg-white border-2 border-yellow-300 rounded-2xl p-6 shadow-sm mb-8 hidden">
            <h2 class="text-lg font-bold text-amber-900 mb-2">Google Gemini API 키 설정</h2>
            <p class="text-xs text-slate-500 mb-4">AQ. 로 시작하는 제미나이 API 키를 입력하세요.</p>
            <div class="flex gap-2">
                <input type="password" id="apiKeyInput" placeholder="API 키를 입력하세요" 
                    class="flex-1 border border-amber-200 rounded-xl px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-yellow-400">
                <button onclick="saveApiKey()" class="bg-yellow-400 hover:bg-yellow-500 text-amber-950 font-bold px-5 py-2 rounded-xl text-sm transition">
                    저장
                </button>
            </div>
        </div>

        <!-- Upload & Action Section -->
        <div class="bg-white border-2 border-yellow-200 rounded-2xl p-6 sm:p-8 shadow-sm mb-8">
            <div class="mb-6">
                <label class="block text-sm font-bold text-amber-900 mb-2">1. 교안 PDF 파일 첨부</label>
                <div class="border-2 border-dashed border-amber-300 rounded-xl p-8 text-center hover:bg-yellow-50/50 transition cursor-pointer relative" onclick="document.getElementById('pdfFile').click()">
                    <input type="file" id="pdfFile" accept="application/pdf" class="hidden" onchange="handleFileSelect(event)">
                    <div id="fileInfo" class="text-slate-600">
                        <span class="text-3xl block mb-2">📄</span>
                        <span class="font-semibold text-amber-900">클릭하여 PDF 파일을 업로드하세요</span>
                        <p class="text-xs text-slate-400 mt-1">지원 형식: PDF (최대 20MB 권장)</p>
                    </div>
                </div>
            </div>

            <button onclick="generateContent()" id="generateBtn" class="w-full bg-yellow-400 hover:bg-yellow-500 active:scale-[0.99] text-amber-950 font-bold py-3.5 rounded-xl shadow-md transition flex items-center justify-center gap-2">
                ✨ 요약 및 예상문제 10문제 생성하기
            </button>
        </div>

        <!-- Loading Spinner -->
        <div id="loadingSection" class="hidden text-center py-12">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-yellow-400 border-t-transparent mb-4"></div>
            <p class="font-semibold text-amber-900">AI가 교안을 꼼꼼히 읽고 분석 중입니다...</p>
            <p class="text-xs text-slate-500 mt-1">문서 분량에 따라 10초~30초 정도 소요될 수 있습니다.</p>
        </div>

        <!-- Result Section -->
        <div id="resultSection" class="hidden space-y-8">
            <!-- Summary Card -->
            <div class="bg-white border-2 border-yellow-200 rounded-2xl p-6 sm:p-8 shadow-sm">
                <h3 class="text-xl font-bold text-amber-900 mb-4 flex items-center gap-2">
                    📌 핵심 교안 요약
                </h3>
                <div id="summaryContent" class="prose text-slate-700 leading-relaxed text-sm sm:text-base whitespace-pre-wrap bg-amber-50/40 p-4 rounded-xl border border-amber-100"></div>
            </div>

            <!-- Quiz Card -->
            <div class="bg-white border-2 border-yellow-200 rounded-2xl p-6 sm:p-8 shadow-sm">
                <h3 class="text-xl font-bold text-amber-900 mb-4 flex items-center gap-2">
                    ✍️ 객관식 4지선다 예상 문제 (10문항)
                </h3>
                <div id="quizContent" class="space-y-6">
                    <!-- Dynamic Quizzes Here -->
                </div>
            </div>
        </div>

    </main>

    <script>
        const DEFAULT_API_KEY = "";
        
        window.addEventListener('DOMContentLoaded', () => {
            if (!localStorage.getItem('gemini_api_key')) {
                localStorage.setItem('gemini_api_key', DEFAULT_API_KEY);
            }
            document.getElementById('apiKeyInput').value = localStorage.getItem('gemini_api_key');
        });

        function toggleSettings() {
            const box = document.getElementById('settingsBox');
            box.classList.toggle('hidden');
        }

        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (!key) {
                alert('API 키를 입력해주세요.');
                return;
            }
            localStorage.setItem('gemini_api_key', key);
            alert('API 키가 저장되었습니다!');
            document.getElementById('settingsBox').classList.add('hidden');
        }

        let selectedFile = null;

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                selectedFile = file;
                document.getElementById('fileInfo').innerHTML = `
                    <span class="text-3xl block mb-2">✅</span>
                    <span class="font-bold text-amber-900 text-base">${file.name}</span>
                    <p class="text-xs text-emerald-600 mt-1">파일 업로드 준비 완료</p>
                `;
            }
        }

        async function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = error => reject(error);
            });
        }

        async function generateContent() {
            const apiKey = localStorage.getItem('gemini_api_key');
            if (!apiKey) {
                alert('API 키를 먼저 설정해주세요.');
                toggleSettings();
                return;
            }
            if (!selectedFile) {
                alert('분석할 PDF 교안 파일을 첨부해주세요.');
                return;
            }

            document.getElementById('loadingSection').classList.remove('hidden');
            document.getElementById('resultSection').classList.add('hidden');
            document.getElementById('generateBtn').disabled = true;

            try {
                const base64Data = await fileToBase64(selectedFile);

                const promptText = `
당신은 최고의 교육 전문가이자 시험 출제위원입니다. 첨부된 PDF 교안 파일을 분석하여 다음 두 가지 작업을 완벽하게 수행해주세요.

1. **주요 내용 요약**: 교안의 핵심 내용을 학생들이 이해하기 쉽도록 구조화하여 요약해주세요. (핵심 주제별로 깔끔한 개조식 정리)
2. **객관식 4지선다 예상 문제 10문제**: 교안에서 가장 중요한 개념을 바탕으로 객관식 4지선다형 문제 10개를 출제해주세요.

반드시 아래의 **JSON 형식**으로만 응답해주세요. 마크다운 백틱(\`\`\`json ... \`\`\`) 없이 순수 JSON 문자열만 출력해주세요.

{
  "summary": "여기에 전체 교안 요약 내용을 마크다운 형태로 작성",
  "questions": [
    {
      "id": 1,
      "question": "문제 내용",
      "options": ["1번 보기", "2번 보기", "3번 보기", "4번 보기"],
      "answer": 0,
      "explanation": "정답 해설 내용"
    }
  ]
}
(참고: answer는 0부터 시작하는 정답 보기의 인덱스 번호입니다.)
                `;

                // 사용 중이신 Gemini 3.8 Flash 모델 엔드포인트 적용
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent`;
                
                const payload = {
                    contents: [
                        {
                            parts: [
                                {
                                    inline_data: {
                                        mime_type: "application/pdf",
                                        data: base64Data
                                    }
                                },
                                {
                                    text: promptText
                                }
                            ]
                        }
                    ]
                };

                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'x-goog-api-key': apiKey
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`API 호출 실패 (${response.status}): ${errorText}`);
                }

                const data = await response.json();
                const rawText = data.candidates[0].content.parts[0].text;
                
                // 정제 (마크다운 코드블록 제거)
                let cleanedJsonText = rawText.trim();
                if (cleanedJsonText.startsWith("```json")) {
                    cleanedJsonText = cleanedJsonText.replace(/^```json/, "").replace(/```$/, "").trim();
                } else if (cleanedJsonText.startsWith("```")) {
                    cleanedJsonText = cleanedJsonText.replace(/^```/, "").replace(/```$/, "").trim();
                }

                const resultData = JSON.parse(cleanedJsonText);

                // 화면에 렌더링
                renderResults(resultData);

            } catch (error) {
                console.error(error);
                alert('처리 중 오류가 발생했습니다: ' + error.message);
            } finally {
                document.getElementById('loadingSection').classList.add('hidden');
                document.getElementById('generateBtn').disabled = false;
            }
        }

        function renderResults(data) {
            // 요약 렌더링
            document.getElementById('summaryContent').innerText = data.summary;

            // 퀴즈 렌더링
            const quizContainer = document.getElementById('quizContent');
            quizContainer.innerHTML = '';

            data.questions.forEach((q, qIdx) => {
                let optionsHtml = '';
                q.options.forEach((opt, oIdx) => {
                    optionsHtml += `
                        <label class="flex items-center gap-3 p-3 rounded-lg border border-amber-100 hover:bg-yellow-50 cursor-pointer transition">
                            <input type="radio" name="question_${qIdx}" value="${oIdx}" class="text-yellow-500 focus:ring-yellow-400">
                            <span class="text-sm text-slate-700">${oIdx + 1}. ${opt}</span>
                        </label>
                    `;
                });

                const questionEl = document.createElement('div');
                questionEl.className = 'bg-amber-50/30 border border-amber-200 rounded-xl p-5 shadow-xs';
                questionEl.innerHTML = `
                    <p class="font-bold text-amber-950 mb-3">Q${q.id}. ${q.question}</p>
                    <div class="space-y-2 mb-3">
                        ${optionsHtml}
                    </div>
                    <button onclick="toggleAnswer(${qIdx})" class="text-xs font-semibold text-amber-800 bg-yellow-200 hover:bg-yellow-300 px-3 py-1.5 rounded-md transition">
                        💡 정답 및 해설 보기
                    </button>
                    <div id="explanation_${qIdx}" class="hidden mt-3 p-3 bg-white border border-amber-300 rounded-lg text-xs text-slate-700">
                        <p class="font-bold text-amber-900 mb-1">정답: ${q.answer + 1}번</p>
                        <p>${q.explanation}</p>
                    </div>
                `;
                quizContainer.appendChild(questionEl);
            });

            document.getElementById('resultSection').classList.remove('hidden');
            document.getElementById('resultSection').scrollIntoView({ behavior: 'smooth' });
        }

        function toggleAnswer(qIdx) {
            const expEl = document.getElementById(`explanation_${qIdx}`);
            expEl.classList.toggle('hidden');
        }
    </script>
</body>
</html>
